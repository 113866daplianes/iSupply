<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8d1726">
  <meta name="description" content="DES iSupply — Supply Request Kiosk">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="iSupply">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>DES iSupply</title>
</head>
<body>
  <main id="appRoot">
    <iframe id="appFrame" title="DES iSupply" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <section id="message" role="status" hidden>
      <h1>iSupply is unavailable</h1>
      <p id="messageText">Connect to the internet and try again.</p>
      <button id="retryButton" type="button">Retry</button>
      <a id="directOpen" href="#" target="_blank" rel="noopener" hidden>Open iSupply directly</a>
    </section>
  </main>
  <script src="./app-config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
